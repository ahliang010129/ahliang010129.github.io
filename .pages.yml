media: public/images
content:
  - name: matches
    label: 比赛战报
    type: collection
    path: src/content/matches
    fields:
      - name: title
        label: 标题
        type: string
      - name: date
        label: 日期
        type: date
      - name: home
        label: 主队
        type: string
      - name: away
        label: 客队
        type: string
      - name: homeScore
        label: 主队得分
        type: number
      - name: awayScore
        label: 客队得分
        type: number
      - name: league
        label: 联赛
        type: string
      - name: sport
        label: 运动类型
        type: string
      - name: venue
        label: 场地
        type: string
      - name: body
        label: 正文
        type: rich-text